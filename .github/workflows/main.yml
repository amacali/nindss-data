name: NINDSS Data
on:
  schedule:
    - cron: '0 8,14,20 * * *'
      timezone: "Australia/Melbourne"
  workflow_dispatch:
    inputs:
      mode:
        description: 'all-time = totals to date; day = rolling 60 days by diagnosis date; year = per-year; month = monthly history'
        type: choice
        options:
          - all-time
          - day
          - year
          - month
        default: all-time

jobs:
  archive:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
        ref: main
    - uses: actions/setup-node@v5
      with:
        node-version: 22

    - name: Install dependencies
      run: npm install --loglevel=error

    - name: Check for a refresh
      id: refresh
      if: github.event_name != 'workflow_dispatch'
      run: |
        if node refresh-check.js --stale; then
          echo "stale=true" >> "$GITHUB_OUTPUT"
        else
          echo "stale=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Run script
      # 'year' writes ref_disease_year_map.json; 'month' reads it — keep this order.
      if: github.event_name == 'workflow_dispatch' || steps.refresh.outputs.stale == 'true'
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          node index.js ${{ github.event.inputs.mode || 'all-time' }}
        else
          node index.js all-time
          node index.js day
          node index.js year
          node index.js month
        fi
      timeout-minutes: 15

    - name: Push data
      if: github.event_name == 'workflow_dispatch' || steps.refresh.outputs.stale == 'true'
      run: |
        git config user.name amacali
        git config user.email anthony@macali.com.au
        git add . || exit 0
        git commit -m "auto(): update feeds" || exit 0
        git push || exit 0
