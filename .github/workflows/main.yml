name: NINDSS Data
on:
  # push:
  #   branches:
  #     - main
  schedule:
    # Times are UTC (GitHub cron has no DST). Anchored to AEDT (UTC+11):
    # 08:00, 12:00, 16:00 and 20:00 AEDT. During AEST (winter) all shift ~1h
    # earlier. The dashboard refreshes about once a day, so most of these
    # windows find nothing new — the refresh guard below skips those in ~2
    # requests rather than re-running a ~2,000-request scrape.
    - cron: '0 21 * * *'    # 08:00 AEDT (previous UTC day)
    - cron: '0 1 * * *'     # 12:00 AEDT
    - cron: '0 5 * * *'     # 16:00 AEDT
    - cron: '0 9 * * *'     # 20:00 AEDT
  workflow_dispatch:
    inputs:
      mode:
        description: 'all-time = totals to date; day = rolling 30 days; year = per-year; month = monthly history'
        type: choice
        options:
          - all-time
          - day
          - year
          - month
        default: all-time

jobs:
  archive:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    # @v5 actions declare `using: node24` — v3/v4 declared node20, which triggers
    # the "Node.js 20 is deprecated … forced to run on Node.js 24" runner warning
    # (Node 20 EOL Apr 2026; runners default to Node 24 on 16 Jun 2026).
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
        ref: main
    - uses: actions/setup-node@v5
      with:
        # Node 20+ required: undici (via cheerio) references the `File` global,
        # which does not exist on Node 18 ("ReferenceError: File is not defined").
        node-version: 22
    - name: Install dependencies
      # --loglevel=error silences npm's harmless transitive-dep deprecation
      # warnings (whatwg-encoding, node-domexception — pulled in under cheerio);
      # real errors still surface.
      run: npm install --loglevel=error
    # Scheduled runs only: skip the scrape when the dashboard has not refreshed
    # since the last run. Exit 1 means the local data is already current.
    # Manual dispatch always runs, so a re-scrape can be forced.
    - name: Check for a refresh
      id: refresh
      if: github.event_name != 'workflow_dispatch'
      run: |
        if node refresh-check.js --stale; then
          echo "stale=true" >> "$GITHUB_OUTPUT"
        else
          echo "stale=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Run script
      # Scheduled runs pass no input → run all four modes. Each rebuilds its
      # whole file: ~15s all-time, ~25s day, ~10s year, ~28s month, about 80s
      # and 333 requests in total. Manual dispatch runs only the selected mode.
      if: github.event_name == 'workflow_dispatch' || steps.refresh.outputs.stale == 'true'
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          node index.js ${{ github.event.inputs.mode || 'all-time' }}
        else
          node index.js all-time
          node index.js day
          node index.js year
          node index.js month
        fi
      timeout-minutes: 15
    - name: Push data
      if: github.event_name == 'workflow_dispatch' || steps.refresh.outputs.stale == 'true'
      run: |
        git config user.name amacali
        git config user.email anthony@macali.com.au
        git add . || exit 0
        git commit -m "auto(): update feeds" || exit 0
        git push || exit 0
