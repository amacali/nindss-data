name: NINDSS Data
on:
  # push:
  #   branches:
  #     - main
  schedule:
    # Times are UTC (GitHub cron has no DST). Anchored to AEDT (UTC+11):
    # 15:30, 16:30 and 20:30 AEDT. During AEST (winter) all shift ~1h
    # earlier. The dashboard refreshes about once a day at ~15:30, so 15:30
    # fires at the refresh itself and often finds nothing; 16:30 is the slot
    # that reliably catches it, and 20:30 is the backup. Most windows find
    # nothing new — the refresh guard below skips those in ~2 requests
    # rather than re-running a ~330-request scrape, so a spare slot is cheap.
    # GitHub queues the schedule event at low priority, so a slot can start
    # over an hour late or not fire at all. The guard makes that safe.
    - cron: '30 4 * * *'    # 15:30 AEDT
    - cron: '30 5 * * *'    # 16:30 AEDT
    - cron: '30 9 * * *'    # 20:30 AEDT (backup for a delayed 16:30)
  workflow_dispatch:
    inputs:
      mode:
        description: 'all-time = totals to date; day = rolling 60 days by diagnosis date; year = per-year; month = monthly history'
        type: choice
        options:
          - all-time
          - day
          - year
          - month
        default: all-time

jobs:
  archive:
    # The runner's speed against the PowerBI host varies by a factor of 100.
    # A local run of all 4 modes takes ~70s, and a fast runner takes ~135s,
    # but on 11 Sep 2026 a runner needed ~100s for ONE of the 66 diseases.
    # No request in powerbi.js sets a timeout or retries, so a stalled
    # request waits until a timeout here kills the step.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
    # @v5 actions declare `using: node24` — v3/v4 declared node20, which triggers
    # the "Node.js 20 is deprecated … forced to run on Node.js 24" runner warning
    # (Node 20 EOL Apr 2026; runners default to Node 24 on 16 Jun 2026).
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
        ref: main
    - uses: actions/setup-node@v5
      with:
        # Node 20+ required: undici (via cheerio) references the `File` global,
        # which does not exist on Node 18 ("ReferenceError: File is not defined").
        node-version: 22
    - name: Install dependencies
      # --loglevel=error silences npm's harmless transitive-dep deprecation
      # warnings (whatwg-encoding, node-domexception — pulled in under cheerio);
      # real errors still surface.
      run: npm install --loglevel=error
    # Scheduled runs only: skip the scrape when the dashboard has not refreshed
    # since the last run. Exit 1 means the local data is already current.
    # Manual dispatch always runs, so a re-scrape can be forced.
    - name: Check for a refresh
      id: refresh
      if: github.event_name != 'workflow_dispatch'
      run: |
        if node refresh-check.js --stale; then
          echo "stale=true" >> "$GITHUB_OUTPUT"
        else
          echo "stale=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Run script
      # Scheduled runs pass no input → run all 4 modes, ~330 requests in
      # total. Manual dispatch runs only the selected mode.
      #
      # ORDER MATTERS: 'year' writes data/ref_disease_year_map.json, and
      # 'month' reads it to skip the 25-year blocks a disease has no cases in.
      # Run 'month' first and it uses the PREVIOUS run's map — which writes
      # zeros, without querying, for a disease-year the map does not list.
      if: github.event_name == 'workflow_dispatch' || steps.refresh.outputs.stale == 'true'
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          node index.js ${{ github.event.inputs.mode || 'all-time' }}
        else
          node index.js all-time
          node index.js day
          node index.js year     # writes ref_disease_year_map.json
          node index.js month    # reads it — must follow 'year'
        fi
      # Raised from 15 after a slow runner timed out with 62 of 66 diseases
      # left. A healthy run finishes well inside this; the limit only stops a
      # run that cannot finish, so it must not be removed.
      timeout-minutes: 40
    - name: Push data
      if: github.event_name == 'workflow_dispatch' || steps.refresh.outputs.stale == 'true'
      run: |
        git config user.name amacali
        git config user.email anthony@macali.com.au
        git add . || exit 0
        git commit -m "auto(): update feeds" || exit 0
        git push || exit 0
