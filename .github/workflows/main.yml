name: NINDSS Data
on:
  schedule:
    # Two UTC anchors for the same local targets (08:00, 14:00, 20:00,
    # 02:00 Melbourne) — one for AEST, one for AEDT. Whichever isn't the
    # current offset fires an hour off and gets skipped by the local-time
    # check below, so this self-corrects across DST changes with no edits.
    - cron: '0 22,4,10,16 * * *'  # AEST (UTC+10)
    - cron: '0 21,3,9,15 * * *'   # AEDT (UTC+11)
  workflow_dispatch:
    inputs:
      mode:
        description: 'all-time = totals to date; day = rolling 60 days by diagnosis date; year = per-year; month = monthly history'
        type: choice
        options:
          - all-time
          - day
          - year
          - month
        default: all-time

jobs:
  archive:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
        ref: main
    - uses: actions/setup-node@v5
      with:
        node-version: 22

    - name: Check Melbourne local time
      id: time
      if: github.event_name != 'workflow_dispatch'
      # Target local times: 08:00, 14:00, 20:00, 02:00 Melbourne. Adjust the
      # hour list here if the target refresh time moves.
      run: |
        HOUR=$(TZ='Australia/Melbourne' date +%H)
        if [[ "$HOUR" =~ ^(08|14|20|02)$ ]]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install dependencies
      if: github.event_name == 'workflow_dispatch' || steps.time.outputs.run == 'true'
      run: npm install --loglevel=error

    - name: Check for a refresh
      id: refresh
      if: github.event_name != 'workflow_dispatch' && steps.time.outputs.run == 'true'
      run: |
        if node refresh-check.js --stale; then
          echo "stale=true" >> "$GITHUB_OUTPUT"
        else
          echo "stale=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Run script
      # 'year' writes ref_disease_year_map.json; 'month' reads it — keep this order.
      if: github.event_name == 'workflow_dispatch' || steps.refresh.outputs.stale == 'true'
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          node index.js ${{ github.event.inputs.mode || 'all-time' }}
        else
          node index.js all-time
          node index.js day
          node index.js year
          node index.js month
        fi
      timeout-minutes: 15

    - name: Push data
      if: github.event_name == 'workflow_dispatch' || steps.refresh.outputs.stale == 'true'
      run: |
        git config user.name amacali
        git config user.email anthony@macali.com.au
        git add . || exit 0
        git commit -m "auto(): update feeds" || exit 0
        git push || exit 0
